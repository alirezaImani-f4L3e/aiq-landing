stages:
  - build
  - publish

build:
    stage: build
    rules:
      - if: $CI_BUILD_REF_NAME == "master"
      - if: $CI_BUILD_REF_NAME == "develop"
    script:
        - docker build -t "$CI_REGISTRY_IMAGE/base:$CI_BUILD_REF_SLUG" .
        - docker login -u gitlab-ci-token -p "$CI_BUILD_TOKEN" "$CI_REGISTRY"
        - docker push $CI_REGISTRY_IMAGE/base:$CI_BUILD_REF_SLUG
        - docker rmi $CI_REGISTRY_IMAGE/base:$CI_BUILD_REF_SLUG
        - docker image prune -f
    tags:
        - ser-staging-04

    
